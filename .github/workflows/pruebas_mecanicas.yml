name: Pruebas de ingenieria mecanica

on:
  push:
    branches:
      - desarrollo/analisis-mecanico-integral
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Compilar todos los modulos Python
        run: python -m compileall -q analisis tests app.py
      - name: Ejecutar pruebas unitarias y de integracion
        run: python -m unittest discover -s tests -p 'test_*.py' -v
