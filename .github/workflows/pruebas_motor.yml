name: Pruebas del motor mecánico

on:
  push:
    branches: [main]
    paths:
      - 'Analisis_mecanico_conductores/**'
      - 'Analisis_mecanico_estructuras/**'
      - 'comun/**'
      - 'motor_general.py'
      - 'entradas/**'
      - 'ayuda/**'
      - 'tests/**'
      - 'tools/**'
      - 'main.py'
      - 'app.py'
      - '.github/workflows/pruebas_motor.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Analisis_mecanico_conductores/**'
      - 'Analisis_mecanico_estructuras/**'
      - 'comun/**'
      - 'motor_general.py'
      - 'entradas/**'
      - 'ayuda/**'
      - 'tests/**'
      - 'main.py'
      - 'app.py'
      - 'requirements.txt'
      - 'tools/**'
      - '.github/workflows/pruebas_motor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unitarias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pytest
      - name: Pruebas de regresión
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m unittest discover -s Analisis_mecanico_conductores/pruebas -p 'test_*.py' -v
      - name: Auditoría estructural de todo el código Python
        run: python tools/auditar_codigo.py
      - name: Auditoría de nombres sin uso (informativa)
        run: |
          python -m pip install ruff
          ruff check . --select F401,F841 --output-format concise || true
      - name: Compilación sintáctica
        run: python -m compileall -q Analisis_mecanico_conductores Analisis_mecanico_estructuras comun entradas motor_general.py main.py
