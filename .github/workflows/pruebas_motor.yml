name: Pruebas del motor mecánico

on:
  push:
    branches: [main]
    paths:
      - 'calculos/**'
      - 'entradas/**'
      - 'tests/**'
      - 'main.py'
      - 'app.py'
      - 'salidas/**'
      - '.github/workflows/pruebas_motor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unitarias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Pruebas de regresión
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compilación sintáctica
        run: python -m compileall -q calculos entradas main.py
